<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="talkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#talkBg)"/>

  <!-- Studio softbox lighting vignette -->
  <circle cx="400" cy="190" r="180" fill="#1d2332" opacity="0.4"/>

  <!-- Speaker Framing Guide Overlay -->
  <rect x="250" y="80" width="300" height="260" rx="16" fill="none" stroke="rgba(229,169,82,0.3)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Corner ticks -->
  <path d="M 240 100 L 240 70 L 270 70" fill="none" stroke="#e5a952" stroke-width="2"/>
  <path d="M 560 100 L 560 70 L 530 70" fill="none" stroke="#e5a952" stroke-width="2"/>
  <path d="M 240 320 L 240 350 L 270 350" fill="none" stroke="#e5a952" stroke-width="2"/>
  <path d="M 560 320 L 560 350 L 530 350" fill="none" stroke="#e5a952" stroke-width="2"/>

  <!-- Simulated Lower Third Graphic in Bottom Left of frame -->
  <rect x="100" y="315" width="220" height="48" rx="6" fill="#161a22" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="100" y="315" width="4" height="48" rx="2" fill="#e5a952"/>
  <rect x="116" y="327" width="90" height="8" rx="3" fill="#f5f4f0"/>
  <rect x="116" y="343" width="140" height="7" rx="3" fill="#848a97"/>

  <!-- Play button -->
  <circle cx="400" cy="200" r="38" fill="rgba(18,20,26,0.85)" stroke="#e5a952" stroke-width="2"/>
  <polygon points="394,186 414,200 394,214" fill="#e5a952"/>

  <!-- Top badge -->
  <rect x="50" y="40" width="160" height="26" rx="4" fill="#1b202c" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="130" y="57" fill="#e5a952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">TALKING HEAD / TUTORIAL</text>

  <text x="730" y="58" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="end">05:40 • Clean Dialogue</text>

  <!-- Title -->
  <text x="400" y="395" fill="#f5f4f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Educational &amp; Interview Clean-Up</text>
  <text x="400" y="420" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Jump cut masking • Lower thirds • Audio de-noise • Zoom punches</text>
</svg>
