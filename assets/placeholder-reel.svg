<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="50%" stop-color="#0f1116"/>
      <stop offset="100%" stop-color="#181c25"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49339"/>
      <stop offset="100%" stop-color="#f5ba63"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Timeline representation on bottom -->
  <rect x="50" y="300" width="700" height="90" rx="8" fill="#181c24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Video Track 1 -->
  <rect x="70" y="315" width="180" height="28" rx="4" fill="#2d3545" opacity="0.8"/>
  <rect x="256" y="315" width="230" height="28" rx="4" fill="#384357" opacity="0.9"/>
  <rect x="492" y="315" width="238" height="28" rx="4" fill="#2d3545" opacity="0.8"/>
  
  <!-- Audio Track 1 with Waveform -->
  <rect x="70" y="348" width="660" height="26" rx="4" fill="#1b202c"/>
  <path d="M 80 361 Q 90 352, 100 361 T 120 361 T 140 353 T 160 361 T 180 350 T 200 361 T 220 354 T 240 361 T 260 350 T 280 361 T 300 352 T 320 361 T 340 349 T 360 361 T 380 353 T 400 361 T 420 350 T 440 361 T 460 354 T 480 361 T 500 349 T 520 361 T 540 352 T 560 361 T 580 351 T 600 361 T 620 353 T 640 361 T 660 350 T 680 361 T 700 353 T 720 361" fill="none" stroke="#e5a952" stroke-width="1.8" opacity="0.85"/>
  
  <!-- Playhead line -->
  <line x1="380" y1="290" x2="380" y2="400" stroke="#f5ba63" stroke-width="2"/>
  <polygon points="374,290 386,290 380,300" fill="#f5ba63"/>

  <!-- Center Play Button with Glow -->
  <circle cx="400" cy="180" r="46" fill="#101217" stroke="#e5a952" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="400" cy="180" r="42" fill="#181b22"/>
  <polygon points="393,165 415,180 393,195" fill="#e5a952"/>

  <!-- Top Badges -->
  <rect x="50" y="40" width="140" height="28" rx="6" fill="rgba(229,169,82,0.15)" stroke="rgba(229,169,82,0.4)" stroke-width="1"/>
  <text x="120" y="59" fill="#e5a952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">FEATURED SHOWREEL</text>
  
  <rect x="670" y="40" width="80" height="28" rx="6" fill="#181c24" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="710" y="58" fill="#d1cfc7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">4K UHD</text>

  <!-- Title and timecode overlay -->
  <text x="400" y="250" fill="#f5f4f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1">SHOWREEL HIGHLIGHTS</text>
  <text x="400" y="272" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">01:45 • Pacing, Transitions &amp; Sound Design</text>
</svg>
