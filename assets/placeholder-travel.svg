<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="travelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c24"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#travelBg)"/>

  <!-- Anamorphic letterbox bars (cinematic 2.35:1 effect) -->
  <rect x="0" y="0" width="800" height="40" fill="#090a0d"/>
  <rect x="0" y="410" width="800" height="40" fill="#090a0d"/>

  <!-- Speed ramp curve illustration in center -->
  <path d="M 120 280 C 260 280, 310 140, 400 140 C 490 140, 540 280, 680 280" fill="none" stroke="#2a3243" stroke-width="4"/>
  <path d="M 280 280 C 330 280, 360 140, 400 140 C 440 140, 470 280, 520 280" fill="none" stroke="#e5a952" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Speed indicator flags -->
  <text x="240" y="270" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">100%</text>
  <text x="400" y="125" fill="#e5a952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SPEED RAMP (350%)</text>
  <text x="560" y="270" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">100%</text>

  <!-- Play button -->
  <circle cx="400" cy="220" r="38" fill="rgba(18,20,26,0.9)" stroke="#e5a952" stroke-width="2"/>
  <polygon points="394,206 414,220 394,234" fill="#e5a952"/>

  <!-- Top badge -->
  <rect x="50" y="55" width="150" height="26" rx="4" fill="#1b1f29" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="125" y="72" fill="#e5a952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">TRAVEL &amp; RHYTHM</text>

  <text x="730" y="73" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="end">01:15 • Cinematic Montage</text>

  <!-- Title -->
  <text x="400" y="345" fill="#f5f4f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Rhythmic B-Roll &amp; Speed Transitions</text>
  <text x="400" y="370" fill="#a3a199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Audio beat markers • Whip pans • Sound design effects</text>
</svg>
